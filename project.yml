name: Tether
options:
  bundleIdPrefix: dev.tether
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
packages:
  MTPKit:
    path: Packages/MTPKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Tether:
    type: application
    platform: macOS
    sources: [Tether]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tether.Tether
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tether
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_PUBLIC_KEY: "Viw2h8DI2zSNH8k9J+L5l2MM2Z5u3O2sBSm1QY8QQ94="
        # Ad-hoc signatures carry no Team ID, so dyld refuses to load the (separately signed) Sparkle.framework
        # unless library validation is off.
        CODE_SIGN_ENTITLEMENTS: Tether/Tether.entitlements
    # GENERATE_INFOPLIST_FILE drops unknown INFOPLIST_KEY_* entries, so Sparkle's keys live in an explicit plist
    # that Xcode merges with the generated one.
    info:
      path: Tether/Info.plist
      properties:
        SUFeedURL: https://r415uk3.github.io/Tether/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: MTPKit
        product: MTPKit
      - package: MTPKit
        product: TetherCore
      - package: Sparkle
        product: Sparkle
      - target: MTPHelper
  MTPHelper:
    type: xpc-service
    platform: macOS
    sources: [MTPHelper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tether.Tether.MTPHelper
        PRODUCT_NAME: MTPHelper
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/CLibMTP
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/build/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: MTPHelper/MTPHelper.entitlements
    info:
      path: MTPHelper/Info.plist
      properties:
        XPCService:
          ServiceType: Application
    dependencies:
      - package: MTPKit
        product: MTPKit
      - framework: Vendor/build/lib/libmtp.9.dylib
        embed: true
        codeSign: true
      - framework: Vendor/build/lib/libusb-1.0.0.dylib
        embed: true
        codeSign: true
  TetherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [TetherUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tether.TetherUITests
        TEST_TARGET_NAME: Tether
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Tether
schemes:
  Tether:
    build:
      targets:
        Tether: all
    test:
      targets:
        - TetherUITests
