name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency: { group: release, cancel-in-progress: false }
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -viE 'beta|release_candidate|rc' | sort -V | tail -1)"
      - run: brew install xcodegen
      - uses: actions/cache@v6
        with:
          path: Vendor/build
          key: vendor-${{ runner.os }}-${{ hashFiles('Vendor/build-libs.sh') }}
      - run: '[ -f Vendor/build/lib/libmtp.9.dylib ] || Vendor/build-libs.sh'
      - name: Version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z" >&2; exit 1; }
          grep -qF "MARKETING_VERSION: \"$V\"" project.yml || { echo "project.yml MARKETING_VERSION != $V" >&2; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Script tests
        run: scripts/test-appcast.sh
      - name: Unit tests
        run: cd Packages/MTPKit && xcodebuild test -scheme MTPKit-Package -destination 'platform=macOS' -derivedDataPath ../../DerivedData/pkg
      - name: Build DMG
        run: scripts/build-release.sh --version "$VERSION" --build "$BUILD" --out dist
      - name: Verify embedded public key
        run: |
          KEY=$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' dist/Tether.app/Contents/Info.plist)
          N=$(printf '%s' "$KEY" | base64 -D 2>/dev/null | wc -c | tr -d ' ')
          [ "$N" = 32 ] || { echo "SUPublicEDKey in the built app is not a 32-byte base64 key (placeholder?)" >&2; exit 1; }
          echo "ED_PUBLIC_KEY=$KEY" >> "$GITHUB_ENV"
      # Developer ID signing + notarization would go here (disabled: no Apple Developer Program membership).
      # When available: codesign --options runtime --timestamp -s "Developer ID Application: …" inside-out,
      # then xcrun notarytool submit --wait and xcrun stapler staple on the DMG.
      - name: EdDSA signature
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "missing SPARKLE_ED_PRIVATE_KEY secret" >&2; exit 1; }
          SIGN=DerivedData/release/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
          [ -x "$SIGN" ] || { echo "sign_update not found or not executable at $SIGN" >&2; exit 1; }
          file "$SIGN" | grep -q Mach-O || { echo "$SIGN is not a Mach-O binary (old DSA script?)" >&2; exit 1; }
          # The key goes to sign_update on stdin (documented '--ed-key-file -'); it is never written to disk or echoed.
          SIG=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN" --ed-key-file - -p "dist/Tether-$VERSION.dmg")
          [ -n "$SIG" ] || { echo "empty signature" >&2; exit 1; }
          echo "EDSIG=$SIG" >> "$GITHUB_ENV"
          swift scripts/verify-ed-signature.swift "dist/Tether-$VERSION.dmg" "$ED_PUBLIC_KEY" "$SIG"
      - name: Prepare appcast on gh-pages
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Tether-${VERSION}.dmg"
          rc=0
          git ls-remote --exit-code origin gh-pages >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) git fetch origin gh-pages:gh-pages
               git worktree add ../pages gh-pages ;;
            2) git worktree add --detach ../pages
               git -C ../pages switch --orphan gh-pages ;;
            *) echo "git ls-remote failed with exit code $rc" >&2; exit 1 ;;
          esac
          # Fails here (before anything is published) if the build number is refused.
          scripts/appcast.sh "dist/Tether-$VERSION.dmg" "$VERSION" "$BUILD" "$URL" "$EDSIG" ../pages/appcast.xml
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Tether-$VERSION.dmg" \
            --title "Tether $VERSION" --generate-notes
      - name: Publish appcast
        run: |
          cd ../pages
          touch .nojekyll
          git add appcast.xml .nojekyll
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "appcast: Tether $VERSION"
          git push origin HEAD:gh-pages
